<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作台">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="theme-color" content="#2d4a36">
<title>耿茗傑 · 个人工作台</title>
<style>
:root{
  --bg:#f2ece0;--card:#fbf7ec;--card-deep:#f7f1e2;
  --ink:#2c2416;--ink-soft:#6f6350;--ink-faint:#9a8f7a;
  --green:#4a7c59;--green-deep:#2d4a36;--red:#c23a2b;--blue:#3d6b7c;--ochre:#b5651d;--purple:#7d5a8c;
  --line:#e4dac2;--track:#e8dfca;
  --sb-w:180px;--sb-collapsed:52px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;overflow-x:hidden}
.app{display:flex;min-height:100vh}

/* ====== 侧栏 ====== */
.sidebar{width:var(--sb-w);background:var(--green-deep);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;padding:calc(16px + var(--safe-t)) 10px 12px;z-index:30;transition:width .22s cubic-bezier(.4,0,.2,1)}
.sidebar.collapsed{width:var(--sb-collapsed)}
.brand{display:flex;gap:11px;align-items:center;padding:2px 6px 16px;border-bottom:1px solid rgba(255,255,255,.12);white-space:nowrap;overflow:hidden}
.seal{flex:none;width:40px;height:40px;background:var(--red);color:#fdf3e3;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif SC","Songti SC",serif;font-size:21px;font-weight:700;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25)}
.brand-info{overflow:hidden}
.brand h1{font-family:"Noto Serif SC",serif;font-size:15px;letter-spacing:1.5px;color:#f4eeda;font-weight:700;white-space:nowrap}
.brand p{font-size:10.5px;color:rgba(244,238,218,.5);letter-spacing:.3px;white-space:nowrap}
.sidebar.collapsed .brand-info{display:none}
.sb-toggle{position:absolute;top:calc(14px + var(--safe-t));right:-13px;width:26px;height:26px;background:var(--card);border:1.5px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:var(--ink-soft);z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sb-toggle:active{transform:scale(.92)}
nav{flex:1;overflow-y:auto;margin-top:10px;padding-right:2px}
nav::-webkit-scrollbar{width:3px}
nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;color:rgba(240,233,214,.68);font-size:13px;margin-bottom:1px;position:relative;user-select:none;transition:background .12s;white-space:nowrap;overflow:hidden}
.nav-item .ico{font-size:16px;width:22px;text-align:center;flex:none}
.nav-item .lbl{overflow:hidden;text-overflow:ellipsis}
.nav-item:hover{background:rgba(255,255,255,.06);color:#f4eeda}
.nav-item.on{background:rgba(255,255,255,.1);color:#fff}
.nav-item.on::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;background:var(--red);border-radius:2px}
.nav-item .cnt{margin-left:auto;font-size:10px;background:rgba(255,255,255,.12);border-radius:99px;padding:0 6px;color:rgba(244,238,218,.8)}
.sidebar.collapsed .lbl,.sidebar.collapsed .cnt,.sidebar.collapsed .brand-info{display:none}
.foot{font-size:10.5px;color:rgba(240,233,214,.38);padding:10px 4px 2px;border-top:1px solid rgba(255,255,255,.08);line-height:1.8;white-space:nowrap;overflow:hidden}
.sidebar.collapsed .foot{display:none}
.foot button{display:block;width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(244,238,218,.65);border-radius:6px;font-size:11px;padding:5px 0;cursor:pointer;margin-bottom:4px}

/* ====== 主区 ====== */
main{flex:1;margin-left:var(--sb-w);transition:margin-left .22s cubic-bezier(.4,0,.2,1);padding:24px 32px 80px;min-width:0}
.app.sb-collapsed main{margin-left:var(--sb-collapsed)}
.wrap{max-width:1100px;margin:0 auto}
.page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.page-head h2{font-family:"Noto Serif SC",serif;font-size:21px;letter-spacing:1.5px;display:flex;align-items:center;gap:8px;font-weight:700}
.page-head h2::before{content:'';width:8px;height:8px;background:var(--red);border-radius:2px;transform:rotate(45deg);flex:none}
.page-head .sub{font-size:12px;color:var(--ink-faint)}

/* ====== 连接状态 ====== */
.conn{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-faint);padding:3px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.conn .dot{width:8px;height:8px;border-radius:50%;background:#bbb;animation:none}
.conn.online .dot{background:var(--green);animation:pulse 2s infinite}
.conn.syncing .dot{background:var(--ochre);animation:pulse 1s infinite}
.conn.error .dot{background:var(--red)}
.conn.offline .dot{background:#bbb}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ====== 卡片 ====== */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(70,52,22,.06);margin-bottom:16px}
.card h3{font-family:"Noto Serif SC",serif;font-size:15px;letter-spacing:1px;margin-bottom:12px;display:flex;align-items:center;gap:7px;font-weight:700}
.card h3 .tag-mini{font-family:inherit;font-size:11px;color:var(--ink-faint);font-weight:400;margin-left:auto;letter-spacing:0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ====== 控件 ====== */
input[type=text],input[type=number],input[type=date],select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink);background:#fffdf6;border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
textarea{resize:vertical;width:100%}
.btn{background:var(--green);color:#fdf6e9;border:none;border-radius:8px;padding:7px 16px;font-size:13.5px;cursor:pointer;letter-spacing:1px;transition:filter .12s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn-blue{background:var(--blue)}.btn-red{background:var(--red)}.btn-ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-faint);font-size:14px;padding:2px 6px;border-radius:5px;line-height:1}
.icon-btn:hover{color:var(--red);background:rgba(194,58,43,.08)}
.add-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.add-row input[type=text]{flex:1;min-width:140px}

/* ====== 徽章/标签 ====== */
.badge{display:inline-block;font-size:11px;padding:1.5px 9px;border-radius:99px;color:#fff;letter-spacing:.5px;line-height:1.7;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12.5px;padding:4px 13px;border-radius:99px;border:1px solid var(--line);background:#fffdf6;color:var(--ink-soft);cursor:pointer;user-select:none;transition:all .12s}
.chip:hover{border-color:var(--green);color:var(--green)}
.chip.on{background:var(--green);border-color:var(--green);color:#fdf6e9}
.chip.on-red{background:var(--red);border-color:var(--red);color:#fdf6e9}

/* ====== 列表项 ====== */
.item{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:none}
.item .grow{flex:1;min-width:0}
.item .txt{word-break:break-word}
.item .meta{font-size:11px;color:var(--ink-faint);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.check{flex:none;width:19px;height:19px;border:1.5px solid #c9bfa6;border-radius:50%;cursor:pointer;margin-top:2px;display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px;background:#fffdf6;transition:all .15s}
.check:hover{border-color:var(--green)}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.done .txt{text-decoration:line-through;color:var(--ink-faint)}
.sec-title{font-size:12px;color:var(--ink-faint);letter-spacing:1px;margin:14px 0 4px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.sec-title::after{content:'';flex:1;height:1px;background:var(--line)}
.sec-title .arrow{transition:transform .2s}
.sec-title.open .arrow{transform:rotate(90deg)}
.sec-body{display:none}
.sec-body.open{display:block}
.empty{color:var(--ink-faint);font-size:12.5px;text-align:center;padding:16px 0;letter-spacing:1px}

/* ====== 进度条 ====== */
.bar-lg{height:9px;background:var(--track);border-radius:5px;overflow:hidden;margin:8px 0 4px}
.bar-lg i{display:block;height:100%;background:var(--green);border-radius:5px;transition:width .3s}

/* ====== 打卡 ====== */
.ci-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ci{background:#fffdf6;border:1.5px solid var(--line);border-radius:12px;padding:14px 12px;text-align:center;cursor:pointer;user-select:none;transition:all .15s;position:relative}
.ci:hover{border-color:var(--green)}
.ci .name{font-size:13.5px;font-weight:600;letter-spacing:.5px}
.ci .st{font-size:11px;color:var(--ink-faint);margin-top:3px}
.ci.on{border-color:var(--green);background:#edf3ea}
.ci.on::after{content:'✓';position:absolute;top:6px;right:8px;color:var(--red);font-weight:700;font-size:13px}
.ci.on .st{color:var(--green)}
.mini-stat{flex:1;min-width:120px;background:var(--card-deep);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:center}
.mini-stat .v{font-family:Georgia,serif;font-size:22px;font-weight:700;color:var(--red)}
.mini-stat .v span{font-size:13px;color:var(--ink-faint);font-weight:400}
.mini-stat .k{font-size:11.5px;color:var(--ink-soft)}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}

/* ====== 日历 ====== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .ym{font-family:"Noto Serif SC",serif;font-size:16px;font-weight:700;letter-spacing:1px}
.cal-head button{background:var(--card);border:1px solid var(--line);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:14px;color:var(--ink-soft)}
.cal-head button:active{background:var(--card-deep)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-grid .dow{font-size:11px;color:var(--ink-faint);text-align:center;padding:4px 0;font-weight:600}
.cal-cell{min-height:52px;border:1px solid var(--line);border-radius:8px;padding:3px 5px;font-size:11px;background:#fffdf6;cursor:pointer;position:relative;transition:all .12s}
.cal-cell:hover{border-color:var(--green)}
.cal-cell.today{border-color:var(--red);border-width:2px}
.cal-cell.sel{background:#f6e7df;box-shadow:0 0 0 2px var(--red) inset}
.cal-cell.other{opacity:.35}
.cal-cell .dn{font-weight:700;color:var(--ink-soft)}
.cal-cell.today .dn{color:var(--red)}
.cal-cell .mood{font-size:14px;text-align:center;line-height:1.2}
.cal-cell .ci-bar{position:absolute;bottom:2px;left:3px;right:3px;height:4px;background:var(--track);border-radius:2px;overflow:hidden}
.cal-cell .ci-bar i{display:block;height:100%;background:var(--green)}

/* ====== 心情选择 ====== */
.mood-pick{display:flex;gap:16px;justify-content:center;padding:14px 0}
.mood-pick .m{font-size:32px;cursor:pointer;opacity:.5;transition:all .15s;user-select:none}
.mood-pick .m:hover{opacity:.8;transform:scale(1.1)}
.mood-pick .m.on{opacity:1;transform:scale(1.15)}
/* ====== 当日详情 ====== */
.day-detail{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.day-detail .dd-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.day-detail .dd-date{font-family:"Noto Serif SC",serif;font-size:15px;font-weight:700;letter-spacing:1px;color:var(--ink)}
.day-detail .dd-stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.day-detail .dd-stats .tag-mini{margin:0}
.dd-ci{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.dd-ci span{font-size:11.5px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--ink-faint);background:#fffdf6}
.dd-ci span.on{background:var(--green-deep);border-color:var(--green-deep);color:#f4eeda}
.dd-back{font-size:12px;color:var(--green);cursor:pointer;border:1px solid var(--green);border-radius:8px;padding:3px 12px;background:none;white-space:nowrap}
.dd-back:active{background:var(--green);color:#fff}

/* ====== 论文 ====== */
.paper{background:#fffdf6;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.paper .p-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.paper .p-name{font-family:"Noto Serif SC",serif;font-size:16px;font-weight:700;letter-spacing:1px}
.paper .p-pct{margin-left:auto;font-family:Georgia,serif;font-size:19px;font-weight:700;color:var(--red)}
.ch-list{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:2px 18px}
.ch{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:7px;font-size:13px}
.ch:hover{background:var(--card-deep)}
.ch .check{width:16px;height:16px;margin-top:0;font-size:10px}
.ch.done .txt{text-decoration:line-through;color:var(--ink-faint)}
.ch .txt{flex:1;cursor:pointer}
.ch-add{display:flex;gap:8px;margin-top:10px}
.ch-add input{flex:1}

/* ====== 记录卡片 ====== */
.rec-card{background:#fffdf6;border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px}
.rec-card .r-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.rec-card .r-head .date{font-size:11.5px;color:var(--ink-faint)}
.rec-card .r-head .icon-btn{margin-left:auto}
.rec-body{font-size:13px}
.rec-body p{margin:2px 0}
.rec-body b{color:var(--blue);font-weight:600;margin-right:4px}
.rec-body .ed{color:var(--red);font-style:italic}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-grid .full{grid-column:1/-1}
.fld label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;letter-spacing:.5px}
.fld input,.fld select,.fld textarea{width:100%}

/* ====== 鼓励语 ====== */
.cheer{background:linear-gradient(135deg,#edf3ea,#f7f1e2);border:1.5px solid var(--green);border-radius:14px;padding:18px 24px;text-align:center;font-family:"Noto Serif SC",serif;font-size:16px;letter-spacing:2px;color:var(--green-deep);margin-bottom:16px;display:none;animation:fadeIn .5s}
.cheer.show{display:block}
.cheer .seal-sm{display:inline-block;background:var(--red);color:#fdf3e3;width:32px;height:32px;border-radius:8px;line-height:32px;font-size:16px;font-weight:700;margin-right:10px;vertical-align:middle}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* ====== 运动体重曲线 ====== */
.weight-chart{width:100%;height:160px;background:#fffdf6;border:1px solid var(--line);border-radius:12px;margin-top:12px}
.weight-chart svg{width:100%;height:100%}

/* ====== 外链卡片 ====== */
.link-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.link-card{background:#fffdf6;border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.link-card:hover{border-color:var(--green);background:#edf3ea;transform:translateY(-1px)}
.link-card .li{font-size:22px}
.link-card .lt{font-size:13.5px;font-weight:600}
.link-card .ls{font-size:11px;color:var(--ink-faint);margin-top:1px}

/* ====== 编辑模态 ====== */
.modal-bg{position:fixed;inset:0;background:rgba(44,36,22,.4);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal h3{font-family:"Noto Serif SC",serif;font-size:16px;margin-bottom:14px;letter-spacing:1px}
.modal .btns{display:flex;gap:10px;margin-top:14px}

/* ====== 顶栏 Hero ====== */
.hero{background:linear-gradient(135deg,#2d4a36,#3a5f44);border-radius:16px;padding:20px 24px;margin-bottom:16px;color:#f4eeda;position:relative;overflow:hidden}
.hero .h-date{font-size:12px;color:rgba(244,238,218,.6);letter-spacing:1px}
.hero .h-welcome{font-family:"Noto Serif SC",serif;font-size:20px;letter-spacing:2px;font-weight:700;margin-top:4px}
.hero .h-cheer{font-size:13px;color:rgba(244,238,218,.8);margin-top:8px;letter-spacing:1px;line-height:1.7;max-width:70%}
.hero .h-clock{position:absolute;right:22px;top:50%;transform:translateY(-50%);text-align:right;font-family:Georgia,serif}
.hero .h-clock .t{font-size:25px;font-weight:700;letter-spacing:2px;color:#f4eeda}
.hero .h-clock .s{font-size:10.5px;color:rgba(244,238,218,.5);letter-spacing:2px}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
/* ====== 横向大导航选项卡 ====== */
.bigtabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin-bottom:14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bigtabs::-webkit-scrollbar{display:none}
.bigtabs .bt{flex:none;padding:9px 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:13.5px;color:var(--ink-soft);cursor:pointer;user-select:none;white-space:nowrap;letter-spacing:1px;transition:all .12s;font-family:"Noto Serif SC",serif}
.bigtabs .bt:hover{border-color:var(--green);color:var(--green)}
.bigtabs .bt.on{background:var(--green-deep);border-color:var(--green-deep);color:#f4eeda}

/* ====== 手机端 ====== */
.mobile-top{display:none;position:sticky;top:0;z-index:25;background:var(--green-deep);color:#f4eeda;padding:10px 16px;padding-top:calc(10px + var(--safe-t));display:none;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(45,74,54,.2)}
.mobile-top .seal{width:32px;height:32px;font-size:17px;border-radius:7px}
.mobile-top h1{font-family:"Noto Serif SC",serif;font-size:15px;letter-spacing:1.5px;font-weight:700}
.mobile-top p{font-size:10px;color:rgba(244,238,218,.5)}
.mobile-top .conn{margin-left:auto;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15);color:rgba(244,238,218,.7)}
.mobile-top .conn .dot{background:rgba(255,255,255,.3)}
.mobile-top .conn.online .dot{background:#7dca7d}
.mobile-top .conn.syncing .dot{background:var(--ochre)}
.mobile-top .conn.error .dot{background:var(--red)}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fbf7ec;border-top:1px solid var(--line);display:none;padding:6px 4px calc(6px + var(--safe-b))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;color:var(--ink-faint);cursor:pointer;padding:4px 0;border-radius:10px;user-select:none}
.tab .ico{font-size:19px;line-height:1.2}
.tab.on{color:var(--green)}
.tab.on::before{content:'';position:absolute;top:-7px;width:20px;height:3px;background:var(--red);border-radius:2px}
.tab{position:relative}

@media(max-width:900px){
  .app{display:block}
  .sidebar{display:none}
  .mobile-top{display:flex}
  .tabbar{display:flex}
  main{margin-left:0!important;padding:14px 12px calc(80px + var(--safe-b))}
  .wrap{max-width:100%}
  .grid9{grid-template-columns:repeat(2,1fr)}
  .two-col{grid-template-columns:1fr}
  .ci-grid{grid-template-columns:repeat(3,1fr)}
  .ch-list{grid-template-columns:1fr}

function mergeObj(d,s){
  if(s===undefined)return d;
  if(Array.isArray(d))return Array.isArray(s)?s:d;
  if(d&&typeof d==='object'){
    if(!s||typeof s!=='object'||Array.isArray(s))return{};
    const o=Object.assign({},s);
    for(const k in d)o[k]=mergeObj(d[k],s[k]);
    return o;
  }
  return s;
}

/* ====== IndexedDB 封装 ====== */
let _db=null;
function idbOpen(){
  return new Promise((res)=>{
    if(_db)return res(_db);
    try{
      const r=indexedDB.open(DB_NAME,1);
      r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE);};
      r.onsuccess=e=>{_db=e.target.result;res(_db);};
      r.onerror=()=>res(null);
    }catch(err){res(null);}
  });
}
async function idbGet(key){
  const db=await idbOpen();if(!db)return null;
  return new Promise(res=>{const tx=db.transaction(STORE,'readonly');const st=tx.objectStore(STORE);const r=st.get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);});
}
async function idbSet(key,val){
  const db=await idbOpen();if(!db)return false;
  return new Promise(res=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(val,key);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);});
}

/* ====== Supabase 同步 ====== */
let _supaClient=null;let _connStatus='offline';let _syncTimer=null;
function sbConfig(){try{return JSON.parse(localStorage.getItem(KEY_SB)||'{}');}catch(e){return{};}}
function setConn(status){
  _connStatus=status;
  const map={offline:'本地',online:'已同步',syncing:'同步中',error:'连接失败'};
  const cls=status;
  document.querySelectorAll('.conn').forEach(el=>{el.className='conn '+cls;el.querySelector('.txt')&&(el.querySelector('.txt').textContent=map[status]);});
  const f=document.getElementById('connFoot');if(f)f.textContent='连接状态：'+map[status];
}
async function loadSupabaseJS(){
  if(window.supabase||window._supabaseLoaded)return true;
  if(window._supabaseLoading)return false;
  window._supabaseLoading=true;
  try{
    await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
    return!!window.supabase;
  }catch{return false;}finally{window._supabaseLoading=false;}
}
async function initSupabase(){
  const cfg=sbConfig();if(!cfg.url||!cfg.key)return;
  const ok=await loadSupabaseJS();if(!ok){setConn('offline');return;}
  try{
    _supaClient=window.supabase.createClient(cfg.url,cfg.key);
    // 测试连接
    const{error}=await _supaClient.from('workbench').select('id').limit(1);
    if(error)throw error;
    setConn('online');
    await initCloudSyncedAt();
    await syncFromCloud();
    startCloudPolling();
  }catch{setConn('error');_supaClient=null;}
}
async function syncToCloud(){
  if(!_supaClient)return;
  if(_syncTimer)clearTimeout(_syncTimer);
  _syncTimer=setTimeout(async()=>{
    _syncTimer=null;
    if(_pushing)return;
    _pushing=true;setConn('syncing');
    try{
      const now=new Date().toISOString();
      const{error}=await _supaClient.from('workbench').upsert({id:'main',data:state,updated_at:now});
      if(error)throw error;
      _dirty=false;
      _cloudSyncedAt=new Date(now).getTime();
      await idbSet('cloud_synced_at',_cloudSyncedAt);
      setConn('online');
    }catch{setConn('error');}finally{_pushing=false;}
  },1500);
}
let _syncingFromCloud=false;
let _cloudSyncedAt=0;
let _pushing=false;let _dirty=false;
/* 深度合并：local 为主，cloud 只补缺口（新增条目/新键），绝不删除本地已有内容 */
function mergeState(local,cloud){
  let changed=false;
  const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  function deep(a,b){
    if(Array.isArray(a)&&Array.isArray(b)){
      const keyOf=it=>{
        if(it&&typeof it==='object')return(it.id!==undefined&&it.id!==null)?('id:'+it.id):('k:'+JSON.stringify(it));
        return 'v:'+it;
      };
      const out=a.slice();const seen=new Set(a.map(keyOf));
      for(const it of b){const k=keyOf(it);if(!seen.has(k)){out.push(it);seen.add(k);changed=true;}}
      return out;
    }
    if(isObj(a)&&isObj(b)){
      const out=Object.assign({},a);
      for(const k of Object.keys(b)){
        if(a[k]===undefined){out[k]=b[k];changed=true;}
        else if(isObj(a[k])&&isObj(b[k]))out[k]=deep(a[k],b[k]);
        else if(Array.isArray(a[k])&&Array.isArray(b[k]))out[k]=deep(a[k],b[k]);
      }
      return out;
    }
    return(a===undefined||a===null)?b:a;
  }
  return{state:deep(local,cloud),changed};
}
async function syncFromCloud(){
  if(!_supaClient||_syncingFromCloud)return;
  // 本地有未推送的修改时绝不拉取覆盖，防止刚写的内容被旧云端数据冲掉
  if(_dirty||_pushing||_saveTimer||_syncTimer){syncToCloud();return;}
  _syncingFromCloud=true;
  try{
    const{data,error}=await _supaClient.from('workbench').select('data,updated_at').eq('id','main').maybeSingle();
    if(error)throw error;
    if(data&&data.data){
      const cloud=data.data;
      const cloudTs=new Date(data.updated_at).getTime()||0;
      const localTs=(await idbGet('updated_at'))||0;
      if(cloudTs>_cloudSyncedAt&&cloudTs>localTs){
        // 覆盖前备份当前本地状态，万一同步冲突可找回
        const cur=await idbGet(KEY_STATE);
        if(cur)await idbSet('backup_state',cur);
        // 深度合并而非整份覆盖：云端只补缺，本地内容不丢
        const m=mergeState(state,mergeObj(defaultData(),cloud));
        state=m.state;
        await idbSet(KEY_STATE,state);
        _cloudSyncedAt=cloudTs;
        await idbSet('cloud_synced_at',cloudTs);
        if(m.changed)syncToCloud(); // 把合并结果推回云端，让另一台设备也能拿到
        render();
      }else if(localTs>cloudTs&&localTs>_cloudSyncedAt){
        syncToCloud();
      }
    }
  }catch{}finally{_syncingFromCloud=false;}
}
async function initCloudSyncedAt(){
  const ts=await idbGet('cloud_synced_at');
  _cloudSyncedAt=ts||0;
}
function startCloudPolling(){
  const syncNow=()=>{
    if(!_supaClient||_connStatus!=='online')return;
    if(_dirty||_saveTimer||_syncTimer)syncToCloud();else syncFromCloud();
  };
  // Poll cloud every 30s when connected (iOS may not fire this in background, but works in foreground)
  setInterval(syncNow,30000);
  // Pull from cloud when tab becomes visible again
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow();});
  // iOS PWA: pageshow fires when returning to cached page
  window.addEventListener('pageshow',syncNow);
  // Also pull on window focus
  window.addEventListener('focus',syncNow);
}

async function callAI(prompt){
  const cfg=aiConfig();if(!cfg.key)return{error:'未配置 AI 服务，请到设置中填写 API Key'};
  const isZhipu=cfg.provider!=='deepseek';
  const url=isZhipu?'https://open.bigmodel.cn/api/paas/v4/chat/completions':'https://api.deepseek.com/chat/completions';
  const model=isZhipu?'glm-4-flash':'deepseek-chat';
  try{
    const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body:JSON.stringify({model,messages:[{role:'user',content:prompt}],temperature:0.8,max_tokens:1000})});
    if(!resp.ok){const t=await resp.text();return{error:'API错误('+resp.status+'): '+t.slice(0,200)};}
    const d=await resp.json();return{ok:true,text:d.choices?.[0]?.message?.content||'(空)'};}
  catch(e){return{error:'网络错误: '+e.message};}
}
/* ====== 热点 API ====== */
async function fetchHotList(type){
  const typeMap={weibo:'weibo',zhihu:'zhihu',bilibili:'bili',douyin:'douyin'};
  const ep=typeMap[type]||type;
  try{
    const r=await fetch(HOT_API_URL+'/'+ep,{headers:{'Accept':'application/json'}});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    if(d.code===200&&Array.isArray(d.data))return d.data;
    return null;
  }catch{return null;}
}
async function fetchAllHot(){
  let date='',fromCache=false;
  // Try GitHub Action snapshot first (same-origin, no CORS issues)
  try{
    const r=await fetch('hot-data.json?'+Date.now());
    if(r.ok){
      const d=await r.json();
      if(d.data&&(d.data.weibo&&d.data.weibo.length||d.data.zhihu&&d.data.zhihu.length||d.data.douyin&&d.data.douyin.length)){
        date=d.date||'';
        try{localStorage.setItem(KEY_HOT_CACHE,JSON.stringify(d));}catch(e){}
        return{weibo:d.data.weibo,zhihu:d.data.zhihu,bili:d.data.bili,douyin:d.data.douyin,date,fromCache};
      }
    }
  }catch{}
  // Fallback: direct API (sequential)
  const weibo=await fetchHotList('weibo');
  await new Promise(r=>setTimeout(r,1000));
  const zhihu=await fetchHotList('zhihu');
  await new Promise(r=>setTimeout(r,1000));
  const bili=await fetchHotList('bilibili');
  await new Promise(r=>setTimeout(r,1000));
  const douyin=await fetchHotList('douyin');
  if(weibo&&weibo.length||zhihu&&zhihu.length||douyin&&douyin.length){
    date=new Date().toISOString();
    try{localStorage.setItem(KEY_HOT_CACHE,JSON.stringify({date,data:{weibo,zhihu,bili,douyin}}));}catch(e){}
    return{weibo,zhihu,bili,douyin,date,fromCache};
  }
  // Last resort: localStorage cache from a previous successful fetch
  try{
    const c=JSON.parse(localStorage.getItem(KEY_HOT_CACHE)||'null');
    if(c&&c.data&&(c.data.weibo&&c.data.weibo.length||c.data.zhihu&&c.data.zhihu.length||c.data.douyin&&c.data.douyin.length)){
      return{weibo:c.data.weibo,zhihu:c.data.zhihu,bili:c.data.bili,douyin:c.data.douyin,date:c.date||'',fromCache:true};
    }
  }catch(e){}
  return{weibo:null,zhihu:null,bili:null,douyin:null,date:'',fromCache:false};
}

async function loadState(){
  const local=await idbGet(KEY_STATE);
  if(local)state=mergeObj(defaultData(),local);
}
let _saveTimer=null;
function saveState(immediate){
  const doSave=async()=>{
    _dirty=true;
    await idbSet(KEY_STATE,state);
    await idbSet('updated_at',Date.now());
    if(_supaClient&&_connStatus!=='error')syncToCloud();
    checkCheer();
  };
  if(immediate)doSave();
  else{if(_saveTimer)clearTimeout(_saveTimer);_saveTimer=setTimeout(()=>{_saveTimer=null;doSave();},300);}
}

/* ====== 工具 ====== */
const $=s=>document.querySelector(s);
function pad(n){return n<10?'0'+n:''+n}
function todayKey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayCN(){const d=new Date();return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · 星期'+'日一二三四五六'[d.getDay()];}
function dateCN(dk){const[yy,mm,dd]=dk.split('-').map(Number);const wd='日一二三四五六'[new Date(yy,mm-1,dd).getDay()];return yy+'年'+mm+'月'+dd+'日 · 星期'+wd;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nl2br(s){return esc(s).replace(/\n/g,'<br>');}
function weekMonday(dstr){const d=new Date(dstr+'T00:00:00');const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dateShift(dstr,delta){const d=new Date(dstr+'T00:00:00');d.setDate(d.getDate()+delta);return todayKey(d);}
function addMonths(dstr,m){const d=new Date(dstr+'T00:00:00');d.setMonth(d.getMonth()+m);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function paperPct(p){const t=p.chapters.length;return t?Math.round(p.chapters.filter(c=>c.done).length/t*100):0;}
function ciCount(key){const c=state.checkins[key]||{};return CI_ITEMS.filter(([k])=>c[k]).length;}
function ciAllDone(key){return ciCount(key)===CI_ITEMS.length;}
function ciStreak(){let s=todayKey();if(!ciAllDone(s))s=dateShift(s,-1);let n=0;while(ciAllDone(s)){n++;s=dateShift(s,-1);}return n;}
function weekStreak(records){const w=new Set(records.map(weekMonday));let m=weekMonday(todayKey());if(!w.has(m)){m=dateShift(m,-7);if(!w.has(m))return 0;}let n=0;while(w.has(m)){n++;m=dateShift(m,-7);}return n;}
function yearRecords(records){const y=new Date().getFullYear();return records.filter(r=>r.startsWith(y+'-'));}
function accPublished(a){return yearRecords(a.records).length;}
function badge(tag,color){return'<span class="badge" style="background:'+color+'">'+esc(tag)+'</span>';}

/* ====== 鼓励语 ====== */
function checkCheer(){
  const t=todayKey();
  const todosDone=state.todos.filter(x=>x.date===t).every(x=>x.done);
  const hasTodos=state.todos.some(x=>x.date===t);
  const ciDone=ciAllDone(t);
  if((todosDone&&hasTodos)||ciDone){
    showCheer();
  }
}
function showCheer(){
  let el=document.querySelector('.cheer');
  if(!el){el=document.createElement('div');el.className='cheer';const w=document.querySelector('.wrap');const hero=w&&w.querySelector('.hero');if(hero)hero.after(el);else if(w)w.insertBefore(el,w.firstChild);}
  const msg=CHEER_MSGS[Math.floor(Math.random()*CHEER_MSGS.length)];
  el.innerHTML='<span class="seal-sm">勉</span>'+msg;
  el.classList.add('show');
}

function welcomeText(){
  const h=new Date().getHours();const n='耿茗傑';
  if(h<5)return n+'，夜深了，早些休息';
  if(h<9)return n+'，晨光初照，一日之计在于晨';
  if(h<12)return n+'，上午好，专注当下';
  if(h<14)return n+'，午安，小憩片刻';
  if(h<18)return n+'，午后安好，稳步精进';
  if(h<23)return n+'，晚间好，复盘今日';
  return n+'，夜深了，早些休息';
}
function cheerOfDay(){
  const d=new Date();

}

/* ====== 日历组件 ====== */
function calInner(showMoodPicker){
  const ym=ui.calMonth;const y=+ym.slice(0,4),m=+ym.slice(5);
  const first=new Date(y,m-1,1);const startDow=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m,0).getDate();
  const today=todayKey();
  let cells='';
  for(let i=0;i<startDow;i++){const pm=m-2<0?11:m-2;const py=pm>11?y-1:y;const pdays=new Date(pm===11?y-1:y,pm+1,0).getDate();cells+='<div class="cal-cell other"><div class="dn">'+(pdays-startDow+i+1)+'</div></div>';}
  for(let d=1;d<=daysInMonth;d++){
    const dk=y+'-'+pad(m)+'-'+pad(d);
    const isToday=dk===today;
    const mood=state.moods[dk];const moodEmoji=mood?MOODS.find(([k])=>k===mood)[1]:'';
    const dayTodos=state.todos.filter(x=>x.date===dk);
    const doneCnt=dayTodos.filter(x=>x.done).length;
    const ci=ciCount(dk);
    const total=dayTodos.length+(ci>0?6:0);
    const done=doneCnt+ci;
    const pct=total?Math.round(done/total*100):0;
    cells+='<div class="cal-cell'+(isToday?' today':'')+(ui.calSel===dk?' sel':'')+'" data-act="cal-day" data-d="'+dk+'"><div class="dn">'+d+'</div>'+(moodEmoji?'<div class="mood">'+moodEmoji+'</div>':'')+(total?'<div class="ci-bar"><i style="width:'+pct+'%"></i></div>':'')+'</div>';
  }
  const sel=ui.calSel||today;
  const moodPicker=showMoodPicker?'<div class="mood-pick">'+MOODS.map(([k,e,n])=>'<span class="m'+(state.moods[sel]===k?' on':'')+'" data-act="mood-set" data-v="'+k+'" title="'+n+'">'+e+'</span>').join('')+'</div>':'';
  return '<div class="cal-head"><button data-act="cal-prev">‹</button><span class="ym">'+y+'年'+m+'月</span><button data-act="cal-next">›</button></div><div class="cal-grid"><div class="dow">一</div><div class="dow">二</div><div class="dow">三</div><div class="dow">四</div><div class="dow">五</div><div class="dow">六</div><div class="dow">日</div>'+cells+'</div>'+moodPicker;
}
function calWidget(showMoodPicker){
  return '<div class="card"><h3>📅 打卡日历 <span class="tag-mini">点击日期记录心情</span></h3>'+calInner(showMoodPicker)+'</div>';
}
/* 当日详情：任务（完成划线保留）+ 修身打卡 + 心情 */
function dayDetail(dk){
  const t=todayKey();
  const dayTodos=state.todos.filter(x=>x.date===dk);
  const doneCnt=dayTodos.filter(x=>x.done).length;
  const ci=state.checkins[dk]||{};const ciN=ciCount(dk);
  const mood=state.moods[dk];const moodEmoji=mood?MOODS.find(([k])=>k===mood)[1]:'';
  const label=dk===t?'今日':(dk===addDays(t,-1)?'昨日':(dk===addDays(t,1)?'明日':''));
  let h='<div class="day-detail"><div class="dd-head"><span class="dd-date">'+(label?'<span style="color:var(--red);margin-right:6px">'+label+'</span>':'')+dateCN(dk)+'</span>'+(moodEmoji?'<span style="font-size:20px">'+moodEmoji+'</span>':'');
  h+='<span class="dd-stats"><span class="tag-mini">日课 '+doneCnt+'/'+dayTodos.length+'</span><span class="tag-mini">修身 '+ciN+'/6</span>'+(dk!==t?'<button class="dd-back" data-act="cal-today">回到今日</button>':'')+'</span></div>';
  h+='<div class="dd-ci">'+CI_ITEMS.map(([k,n])=>'<span class="'+(ci[k]?'on':'')+'">'+(ci[k]?'✓ ':'')+n+'</span>').join('')+'</div>';
  h+='<div class="sec-title" style="margin-top:8px">当日任务 · 完成后划线保留</div>';
  h+='<div class="add-row" style="margin:8px 0 4px"><input type="text" id="dd-text" placeholder="在这天添加任务…（回车即可）" data-enter="todo-add-day" data-d="'+dk+'"><select id="dd-tag" style="width:auto">'+TODO_TAGS.map(x=>'<option>'+x+'</option>').join('')+'</select><button class="btn" data-act="todo-add-day" data-d="'+dk+'">添加</button></div>';
  h+=dayTodos.length?dayTodos.map(todoItem).join(''):'<div class="empty">当日暂无任务，可在上方直接添加</div>';
  h+='<div class="sec-title" style="margin-top:10px">当日心情</div><div class="mood-pick" style="padding:6px 0 2px">'+MOODS.map(([k,e,n])=>'<span class="m'+(mood===k?' on':'')+'" data-act="mood-set" data-v="'+k+'" title="'+n+'">'+e+'</span>').join('')+'</div>';
  return h+'</div>';
}
function addDays(dk,n){const d=new Date(dk+'T00:00:00');d.setDate(d.getDate()+n);return todayKey(d);}

/* ====== 今日日课 ====== */
function todoItem(x){
  const late=x.date!==todayKey()&&!x.done;
  return'<div class="item'+(x.done?' done':'')+'"><div class="check'+(x.done?' on':'')+'" data-act="todo-toggle" data-id="'+x.id+'">✓</div><div class="grow"><div class="txt">'+esc(x.text)+'</div><div class="meta">'+badge(x.tag,TAG_COLORS[x.tag]||'#8a8371')+(late?'<span style="color:var(--red)">遗留 '+x.date+'</span>':'<span>'+x.date+'</span>')+'</div></div><button class="icon-btn" data-act="todo-edit" data-id="'+x.id+'">✎</button><button class="icon-btn" data-act="todo-del" data-id="'+x.id+'">✕</button></div>';
}
function vTodosBody(){
  let g='<div class="card"><h3>➕ 添加日课</h3><div class="add-row" style="margin-bottom:0"><input type="text" id="td-text" placeholder="要做什么…（可指定日期）" data-enter="todo-add"><select id="td-tag" style="width:auto">'+TODO_TAGS.map(x=>'<option>'+x+'</option>').join('')+'</select><input type="date" id="td-date" value="'+todayKey()+'" style="width:auto"><button class="btn" data-act="todo-add">添加</button></div></div>';
  const f=ui.todoTag;
  const match=x=>f==='all'||x.tag===f;
  const undone=state.todos.filter(x=>!x.done&&match(x)&&x.date>=todayKey()).sort((a,b)=>a.date<b.date?-1:1);
  const doneToday=state.todos.filter(x=>x.done&&x.date===todayKey()&&match(x));
  g+='<div class="card"><h3>🌱 未完成 <span class="tag-mini">'+undone.length+' 项</span></h3><div class="chips">'+['all'].concat(TODO_TAGS).map(x=>'<span class="chip'+(f===x?' on':'')+'" data-act="todo-filter" data-v="'+x+'">'+(x==='all'?'全部':x)+'</span>').join('')+'</div>'+(undone.length?undone.map(todoItem).join(''):'<div class="empty">无待办，一念不生</div>')+'</div>';
  g+='<div class="card"><h3>🍂 今日已完成 <span class="tag-mini">'+doneToday.length+' 项</span></h3>'+(doneToday.length?doneToday.map(todoItem).join(''):'<div class="empty">还没有完成的日课</div>')+'</div>';
  // 历史折叠
  const doneByDate={};
  state.todos.filter(x=>x.done&&match(x)).forEach(x=>{(doneByDate[x.date]||(doneByDate[x.date]=[])).push(x);});
  const dates=Object.keys(doneByDate).sort().reverse().filter(d=>d!==todayKey());
  if(dates.length){
    g+='<div class="card"><h3>📜 历史记录</h3>';
    dates.forEach(d=>{g+='<div class="sec-title" data-act="toggle-sec"><span class="arrow">▸</span>'+d+'（'+doneByDate[d].length+'项）</div><div class="sec-body">'+doneByDate[d].map(todoItem).join('')+'</div>';});
    g+='</div>';
  }
  return g;
}
function vTodos(){
  return pageHead('今日日课','要事第一，日日不断')+vTodosBody();

  const list=st==='全部'?a.topics:a.topics.filter(x=>x.status===st);
  g+='<div class="card"><h3>📋 选题列表 <span class="tag-mini">'+list.length+' 条</span></h3>'+(list.length?list.slice().reverse().map(tp=>'<div class="item"><div class="grow"><div class="txt">'+esc(tp.text)+'</div><div class="meta">'+badge(tp.status,ACC_STATUS_COLORS[tp.status])+'<span>'+tp.date+'</span></div></div><button class="icon-btn" data-act="acc-topic-edit" data-k="'+key+'" data-id="'+tp.id+'">✎</button><button class="icon-btn" data-act="acc-topic-del" data-k="'+key+'" data-id="'+tp.id+'">✕</button></div>').join(''):'<div class="empty">还没有选题</div>')+'</div>';

    // 趋势简报
    const validArts=arts.filter(a=>a.firstReads||a.day7Reads);

      const maxR=Math.max(...validArts.map(a=>a.day7Reads||a.firstReads||0));

    }
    g+=arts.slice().reverse().map(ar=>{
      const gr=ar.day7Reads&&ar.firstReads?Math.round((ar.day7Reads-ar.firstReads)/ar.firstReads*100):0;
      const maxR=Math.max(ar.firstReads||0,ar.day7Reads||0,1);
      return'<div class="rec-card"><div class="r-head">'+badge(ar.date||'','')+(ar.link?'<a href="'+esc(ar.link)+'" target="_blank" style="color:var(--green);font-size:13px;font-weight:600">'+esc(ar.title||'未命名')+'</a>':'<b>'+esc(ar.title||'未命名')+'</b>')+'<span class="date">'+(ar.date||'')+'</span><button class="icon-btn" data-act="acc-art-edit" data-k="'+key+'" data-id="'+ar.id+'">✎</button><button class="icon-btn" data-act="acc-art-del" data-k="'+key+'" data-id="'+ar.id+'">✕</button></div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">'+
      '<div style="font-size:12px;color:var(--ink-soft)">首发：阅读 <b style="color:var(--ink)">'+(ar.firstReads||'-')+'</b> · 点赞 <b style="color:var(--ink)">'+(ar.firstLikes||'-')+'</b> · 在看 <b style="color:var(--ink)">'+(ar.firstWow||'-')+'</b></div>'+
      '<div style="font-size:12px;color:var(--ink-soft)">7日：阅读 <b style="color:var(--ink)">'+(ar.day7Reads||'-')+'</b> · 点赞 <b style="color:var(--ink)">'+(ar.day7Likes||'-')+'</b> · 在看 <b style="color:var(--ink)">'+(ar.day7Wow||'-')+'</b></div>'+
      '</div>'+
      (ar.firstReads&&ar.day7Reads?'<div class="bar-lg" style="margin-top:8px"><i style="width:'+Math.round((ar.day7Reads/maxR)*100)+'%;background:var(--green)"></i></div><div style="font-size:11px;color:var(--ink-faint);margin-top:2px">增长 '+gr+'%</div>':'')+
      (ar.shares||ar.comments?'<div style="font-size:11px;color:var(--ink-faint);margin-top:4px">转发 '+(ar.shares||'-')+' · 留言 '+(ar.comments||'-')+'</div>':'')+
      '</div>';
    }).join('');
  }else{
    g+='<div class="empty">还没有文章数据，发文后点击「添加文章数据」录入</div>';
  }
  g+='</div>';
  return pageHead(ico+' '+title,desc)+g;
}

function weightChart(weights){
  if(!weights.length)return'<div class="empty">还没有体重数据，开始记录吧</div>';
  const sorted=weights.slice().sort((a,b)=>a.date<b.date?-1:1);
  const vals=sorted.map(w=>w.weight);
  const min=Math.min(...vals),max=Math.max(...vals);
  const range=max-min||1;
  const w=300,h=120,pad=20;
  const pts=sorted.map((w,i)=>{const x=pad+(i/(sorted.length-1||1))*(w-pad*2);const y=h-pad-((w.weight-min)/range)*(h-pad*2);return[x,y,w.weight,w.date];});
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const labels=pts.filter((_,i)=>i%Math.ceil(pts.length/6)===0||i===pts.length-1).map(p=>'<text x="'+p[0].toFixed(0)+'" y="'+(h-4)+'" font-size="9" fill="#9a8f7a" text-anchor="middle">'+p[3].slice(5)+'</text><text x="'+p[0].toFixed(0)+'" y="'+(p[1]-5).toFixed(0)+'" font-size="9" fill="#4a7c59" text-anchor="middle">'+p[2]+'</text>').join('');
  return'<div class="weight-chart"><svg viewBox="0 0 '+w+' '+(h+10)+'"><polyline points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="none" stroke="#4a7c59" stroke-width="2" stroke-linejoin="round"/>'+pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="#c23a2b"/>').join('')+labels+'</svg></div>';
}

  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  switch(act){
    case 'nav':ui.view=el.dataset.view;render();if(el.dataset.view==='hottrends'&&ui.hotTab==='auto')setTimeout(loadHotAuto,100);break;
    case 'sb-toggle':{$('#sidebar').classList.toggle('collapsed');$('#app').classList.toggle('sb-collapsed');el.textContent=$('#sidebar').classList.contains('collapsed')?'›':'‹';break;}
    case 'todo-toggle':{const x=state.todos.find(t=>t.id===el.dataset.id);if(x){x.done=!x.done;saveState();render();}break;}
    case 'todo-add':{const t=$('#td-text'),g=$('#td-tag'),d=$('#td-date');if(t&&t.value.trim())addTodo(t.value.trim(),g?g.value:'普通',d&&d.value?d.value:undefined);break;}
    case 'todo-add-day':{const t=$('#dd-text'),g=$('#dd-tag');if(t&&t.value.trim())addTodo(t.value.trim(),g?g.value:'普通',el.dataset.d);break;}
    case 'todo-del':state.todos=state.todos.filter(t=>t.id!==el.dataset.id);saveState();render();break;
    case 'todo-edit':{const x=state.todos.find(t=>t.id===el.dataset.id);if(!x)break;showEditModal('编辑日课',[{id:'text',label:'内容',value:x.text},{id:'tag',label:'标签',type:'select',options:TODO_TAGS,value:x.tag}],v=>{Object.assign(x,{text:v.text,tag:v.tag});saveState();render();});break;}
    case 'todo-filter':ui.todoTag=el.dataset.v;render();break;
    case 'toggle-sec':{const body=el.nextElementSibling;el.classList.toggle('open');body.classList.toggle('open');break;}
    case 'ci-toggle':{const t=todayKey(),c=state.checkins[t]||(state.checkins[t]={});c[el.dataset.k]=!c[el.dataset.k];saveState();render();break;}
    case 'ch-toggle':{const p=state.papers.find(p=>p.id===el.dataset.p);const c=p.chapters[+el.dataset.i];c.done=!c.done;saveState();render();break;}
    case 'ch-del':{const p=state.papers.find(p=>p.id===el.dataset.p);p.chapters.splice(+el.dataset.i,1);saveState();render();break;}
    case 'ch-add':{const p=state.papers.find(p=>p.id===el.dataset.p);const inp=document.querySelector('input[data-enter="ch-add"][data-p="'+p.id+'"]');if(inp&&inp.value.trim()){p.chapters.push({name:inp.value.trim(),done:false});saveState();render();}break;}
    case 'acc-rec':{state.accounts[el.dataset.k].records.push(todayKey());saveState();render();break;}
    case 'acc-rec-del':{const a=state.accounts[el.dataset.k];const i=a.records.indexOf(el.dataset.d);if(i>-1)a.records.splice(i,1);saveState();render();break;}
    case 'acc-status':ui.accStatus=el.dataset.v;render();break;
    case 'acc-topic':{const k=el.dataset.k;const inp=document.getElementById('acc-topic-'+k);const sel=document.getElementById('acc-topic-status-'+k);if(inp&&inp.value.trim()){state.accounts[k].topics.push({id:uid(),text:inp.value.trim(),status:sel?sel.value:'未成文',date:todayKey()});saveState();render();}break;}
    case 'acc-topic-toggle':break;
    case 'acc-topic-del':{const a=state.accounts[el.dataset.k];a.topics=a.topics.filter(t=>t.id!==el.dataset.id);saveState();render();break;}
    case 'acc-topic-edit':{const a=state.accounts[el.dataset.k];const tp=a.topics.find(t=>t.id===el.dataset.id);if(!tp)break;showEditModal('编辑选题',[{id:'text',label:'选题内容',value:tp.text},{id:'status',label:'状态',type:'select',options:ACC_STATUS,value:tp.status}],v=>{tp.text=v.text;tp.status=v.status;saveState();render();});break;}
    case 'acc-art-add':{showEditModal('添加文章数据',[{id:'title',label:'文章标题',placeholder:'如：曹端哲学的现代意义'},{id:'link',label:'文章链接',placeholder:'https://mp.weixin.qq.com/...'},{id:'date',label:'发布日期',type:'date',value:todayKey()},{id:'firstReads',label:'首发阅读量',type:'number'},{id:'firstLikes',label:'首发点赞',type:'number'},{id:'firstWow',label:'首发在看',type:'number'},{id:'day7Reads',label:'7日阅读量',type:'number'},{id:'day7Likes',label:'7日点赞',type:'number'},{id:'day7Wow',label:'7日在看',type:'number'},{id:'shares',label:'转发数',type:'number'},{id:'comments',label:'留言数',type:'number'}],v=>{state.accounts[el.dataset.k].articles.push({id:uid(),title:v.title,link:v.link,date:v.date,firstReads:+v.firstReads||0,firstLikes:+v.firstLikes||0,firstWow:+v.firstWow||0,day7Reads:+v.day7Reads||0,day7Likes:+v.day7Likes||0,day7Wow:+v.day7Wow||0,shares:+v.shares||0,comments:+v.comments||0});saveState();render();});break;}
    case 'acc-art-edit':{const a=state.accounts[el.dataset.k];const ar=a.articles.find(x=>x.id===el.dataset.id);if(!ar)break;showEditModal('编辑文章数据',[{id:'title',label:'文章标题',value:ar.title},{id:'link',label:'文章链接',value:ar.link},{id:'date',label:'发布日期',type:'date',value:ar.date},{id:'firstReads',label:'首发阅读量',type:'number',value:ar.firstReads},{id:'firstLikes',label:'首发点赞',type:'number',value:ar.firstLikes},{id:'firstWow',label:'首发在看',type:'number',value:ar.firstWow},{id:'day7Reads',label:'7日阅读量',type:'number',value:ar.day7Reads},{id:'day7Likes',label:'7日点赞',type:'number',value:ar.day7Likes},{id:'day7Wow',label:'7日在看',type:'number',value:ar.day7Wow},{id:'shares',label:'转发数',type:'number',value:ar.shares},{id:'comments',label:'留言数',type:'number',value:ar.comments}],v=>{Object.assign(ar,{title:v.title,link:v.link,date:v.date,firstReads:+v.firstReads||0,firstLikes:+v.firstLikes||0,firstWow:+v.firstWow||0,day7Reads:+v.day7Reads||0,day7Likes:+v.day7Likes||0,day7Wow:+v.day7Wow||0,shares:+v.shares||0,comments:+v.comments||0});saveState();render();});break;}
    case 'acc-art-del':{state.accounts[el.dataset.k].articles=state.accounts[el.dataset.k].articles.filter(x=>x.id!==el.dataset.id);saveState();render();break;}
    case 'acc-art-import':{const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML='<div class="modal"><h3>📋 粘贴导入</h3><p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;line-height:1.6">从公众号后台导出 Excel 后，选中数据列复制，粘贴到下方。格式：每行一篇，列用 Tab 分隔。<br>如：标题 Tab 阅读量 Tab 点赞量 Tab …</p><textarea id="art-import-area" rows="8" style="width:100%;font-size:11px" placeholder="标题\t阅读量\t点赞\t在看\t转发\t留言\n曹端哲学\t1234\t56\t12\t3\t5"></textarea><button class="btn" style="margin-top:10px" data-act="art-import-go">解析并导入</button><button class="btn btn-ghost" style="margin-top:10px;margin-left:8px" data-act="art-import-cancel">取消</button></div>';document.body.appendChild(bg);bg.querySelector('[data-act="art-import-go"]').onclick=()=>{const txt=bg.querySelector('#art-import-area').value.trim();if(!txt){alert('请粘贴数据');return;}const lines=txt.split('\n').filter(l=>l.trim());let cnt=0;lines.forEach(line=>{const cols=line.split('\t').map(c=>c.trim());if(cols.length>=2){state.accounts[el.dataset.k].articles.push({id:uid(),title:cols[0]||'未命名',link:'',date:todayKey(),firstReads:+cols[1]||0,firstLikes:+cols[2]||0,firstWow:+cols[3]||0,day7Reads:0,day7Likes:0,day7Wow:0,shares:+cols[4]||0,comments:+cols[5]||0});cnt++;}});bg.remove();saveState();render();alert('成功导入 '+cnt+' 篇文章数据');};bg.querySelector('[data-act="art-import-cancel"]').onclick=()=>bg.remove();bg.addEventListener('click',e=>{if(e.target===bg)bg.remove();});break;}
    case 'concept-add':{const sit=$('#cp-sit').value.trim();if(!sit&&!$('#cp-aware').value.trim()&&!$('#cp-gong').value.trim()&&!$('#cp-res').value.trim())break;state.concepts.unshift({id:uid(),date:$('#cp-date').value||todayKey(),category:$('#cp-cat').value,seed:$('#cp-seed').value,sit:sit,aware:$('#cp-aware').value.trim(),gong:$('#cp-gong').value.trim(),res:$('#cp-res').value.trim()});saveState();render();break;}
    case 'concept-del':state.concepts=state.concepts.filter(c=>c.id!==el.dataset.id);saveState();render();break;
    case 'concept-edit':{const c=state.concepts.find(x=>x.id===el.dataset.id);if(!c)break;showEditModal('编辑观念记录',[{id:'date',label:'日期',type:'date',value:c.date},{id:'category',label:'分类',type:'select',options:CONCEPT_CATS,value:c.category},{id:'seed',label:'种子',type:'select',options:SEEDS,value:c.seed},{id:'sit',label:'情境',type:'textarea',value:c.sit},{id:'aware',label:'觉察',type:'textarea',value:c.aware},{id:'gong',label:'功夫',type:'textarea',value:c.gong},{id:'res',label:'结果',type:'textarea',value:c.res}],v=>{Object.assign(c,{date:v.date,category:v.category,seed:v.seed,sit:v.sit,aware:v.aware,gong:v.gong,res:v.res});saveState();render();});break;}
    case 'concept-filter':ui.conceptCat=el.dataset.v;render();break;
    case 'novel-tab':ui.novelTab=el.dataset.v;render();break;
    case 'novel-add':{const t=$('#nv-title').value.trim(),b=$('#nv-body').value.trim();if(!t&&!b)break;state.novel.notes.push({id:uid(),type:ui.novelTab,title:t||'（未命名）',content:b,date:todayKey()});saveState();render();break;}
    case 'novel-del':state.novel.notes=state.novel.notes.filter(x=>x.id!==el.dataset.id);saveState();render();break;
    case 'novel-edit':{const n=state.novel.notes.find(x=>x.id===el.dataset.id);if(!n)break;showEditModal('编辑笔记',[{id:'title',label:'标题',value:n.title},{id:'content',label:'内容',type:'textarea',value:n.content}],v=>{n.title=v.title;n.content=v.content;saveState();render();});break;}
    case 'reading-add':{const b=$('#rd-body').value.trim();if(!b&&!$('#rd-title').value.trim())break;state.reading.unshift({id:uid(),category:$('#rd-cat').value,title:$('#rd-title').value.trim()||'（无标题）',content:b,date:todayKey()});saveState();render();break;}
    case 'reading-del':state.reading=state.reading.filter(x=>x.id!==el.dataset.id);saveState();render();break;
    case 'reading-edit':{const r=state.reading.find(x=>x.id===el.dataset.id);if(!r)break;showEditModal('编辑札记',[{id:'category',label:'分类',type:'select',options:READ_CATS,value:r.category},{id:'title',label:'标题',value:r.title},{id:'content',label:'内容',type:'textarea',value:r.content}],v=>{r.category=v.category;r.title=v.title;r.content=v.content;saveState();render();});break;}
    case 'reading-filter':ui.readCat=el.dataset.v;render();break;
    case 'idea-quick':ui.ideaQuick=el.dataset.v;render();break;
    case 'idea-filter':ui.ideaType=el.dataset.v;render();break;
    case 'idea-add':{const inp=$('#idea-text');if(inp&&inp.value.trim()){state.ideas.unshift({id:uid(),type:ui.ideaQuick,text:inp.value.trim(),date:todayKey()});saveState();render();}break;}
    case 'idea-del':state.ideas=state.ideas.filter(x=>x.id!==el.dataset.id);saveState();render();break;
    case 'idea-edit':{const id=state.ideas.find(x=>x.id===el.dataset.id);if(!id)break;showEditModal('编辑灵感',[{id:'type',label:'类型',type:'select',options:IDEA_TYPES,value:id.type},{id:'text',label:'内容',type:'textarea',value:id.text}],v=>{id.type=v.type;id.text=v.text;saveState();render();});break;}
    case 'ov-todo-add':{const t=$('#ov-todo'),g=$('#ov-tag');if(t&&t.value.trim())addTodo(t.value.trim(),g?g.value:'普通');break;}
    case 'cal-prev':ui.calMonth=addMonths(ui.calMonth+'-01',-1).slice(0,7);render();break;
    case 'cal-next':ui.calMonth=addMonths(ui.calMonth+'-01',1).slice(0,7);render();break;
    case 'cal-day':{const d=el.dataset.d;ui.calSel=d;ui.calMonth=d.slice(0,7);if(ui.view!=='overview'){ui.view='overview';}render();window.scrollTo({top:0,behavior:'smooth'});break;}
    case 'cal-today':{ui.calSel=todayKey();ui.calMonth=todayKey().slice(0,7);render();break;}
    case 'mood-set':{state.moods[ui.calSel||todayKey()]=el.dataset.v;saveState();render();break;}
    case 'ex-type':ui.exerciseType=el.dataset.v;render();break;
    case 'ex-log':{const dur=+$('#ex-dur').value||0;if(!dur)break;state.exercise.logs.push({date:todayKey(),type:ui.exerciseType,dur:dur,note:$('#ex-note').value.trim()});saveState();render();break;}
    case 'ex-del':{state.exercise.logs.splice(+el.dataset.i,1);saveState();render();break;}
    case 'wt-add':{const v=+$('#wt-val').value;if(!v)break;const w=state.exercise.weights;const idx=w.findIndex(x=>x.date===todayKey());if(idx>-1)w[idx].weight=v;else w.push({date:todayKey(),weight:v});saveState();render();break;}
    case 'eng-tab':ui.engTab=el.dataset.v;render();break;
    case 'eng-log':{const t=ui.engTab||'words',q=+$('#eng-qty').value||0;if(!q)break;state.english[t]+=q;state.english.logs.push({date:todayKey(),type:t,qty:q,note:$('#eng-note').value.trim()});saveState();render();break;}
    case 'sb-save':{const url=$('#sb-url').value.trim(),key=$('#sb-key').value.trim();localStorage.setItem(KEY_SB,JSON.stringify({url,key}));if(url&&key){initSupabase();}else{setConn('offline');}render();break;}
    case 'sb-test':{initSupabase();break;}
    case 'sb-clear':{localStorage.removeItem(KEY_SB);_supaClient=null;setConn('offline');render();break;}
    case 'hot-tab':ui.hotTab=el.dataset.v;render();if(ui.hotTab==='auto')setTimeout(loadHotAuto,50);break;
    case 'hot-refresh':loadHotAuto();break;
    case 'hot-manual-add':{const c=$('#hm-content'),s=$('#hm-source'),ht=$('#hm-heat'),lk=$('#hm-link');if(c&&c.value.trim()){state.hottrends.manual.push({id:uid(),date:todayKey(),source:s?s.value:'其他',content:c.value.trim(),heat:ht?ht.value.trim():'',link:lk?lk.value.trim():'',interpretation:''});saveState();render();}break;}
    case 'hot-manual-del':{state.hottrends.manual=state.hottrends.manual.filter(m=>m.id!==el.dataset.id);saveState();render();break;}
    case 'hot-manual-edit':{const m=state.hottrends.manual.find(x=>x.id===el.dataset.id);if(!m)break;showEditModal('编辑热梗',[{id:'source',label:'来源平台',type:'select',options:HOT_MANUAL_SOURCES,value:m.source},{id:'heat',label:'热度',value:m.heat},{id:'content',label:'内容',type:'textarea',value:m.content},{id:'link',label:'链接',value:m.link}],v=>{Object.assign(m,{source:v.source,heat:v.heat,content:v.content,link:v.link});saveState();render();});break;}
    case 'hot-interpret':{const m=state.hottrends.manual.find(x=>x.id===el.dataset.id);if(!m)break;const btn=el;btn.textContent='⏳ 解读中…';btn.disabled=true;const r=await callAI(aiInterpretPrompt(m.content,m.source));if(r.ok){m.interpretation=r.text;saveState();btn.textContent='✅ 已生成';setTimeout(()=>{render();},500);}else{btn.textContent='❌ 失败';setTimeout(()=>{alert(r.error);btn.textContent='🤖 AI解读';btn.disabled=false;},300);}break;}
    case 'hot-to-topic':{const m=state.hottrends.manual.find(x=>x.id===el.dataset.id);if(m)showTopicPicker(m.id,'manual',m.content);break;}
    case 'ai-save':{const p=$('#ai-provider'),k=$('#ai-key');state.ai={provider:p?p.value:'zhipu',key:k?k.value.trim():''};saveState();alert('AI配置已保存并同步');render();break;}
    case 'ai-test':{const r=await callAI('请回复"连接成功"四个字');if(r.ok)alert('✅ AI连接成功！\n\n回复：'+r.text);else alert('❌ '+r.error);break;}
    case 'ai-clear':{state.ai={provider:'zhipu',key:''};saveState();render();break;}
    case 'export':{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='耿茗傑工作台备份-'+todayKey()+'.json';a.click();break;}
    case 'import':{const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=mergeObj(defaultData(),JSON.parse(r.result));saveState(true);render();alert('导入成功');}catch(err){alert('导入失败：'+err.message);}};r.readAsText(f);};inp.click();break;}
    case 'restoreBak':{idbGet('backup_state').then(bak=>{if(!bak){alert('没有找到备份。同步覆盖前的本地数据备份还不存在（旧版本尚未生成过备份）。');return;}const m=mergeState(state,mergeObj(defaultData(),bak));state=m.state;saveState(true);render();alert(m.changed?'✅ 已把备份中的内容合并回来（'+new Date().toLocaleString()+' 之前的本地数据）':'备份内容与当前数据一致，无需恢复。');});break;}
    case 'reset':{if(confirm('确定清空所有数据？此操作不可撤销。')){state=defaultData();saveState(true);render();}break;}
  }
});
document.body.addEventListener('submit',e=>e.preventDefault());
document.body.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const el=e.target.closest('[data-enter]');if(!el)return;
  const act=el.dataset.enter;
  if(act==='todo-add'){const g=$('#td-tag'),d=$('#td-date');addTodo(el.value.trim(),g?g.value:'普通',d&&d.value?d.value:undefined);}
  else if(act==='todo-add-day'){const g=$('#dd-tag');addTodo(el.value.trim(),g?g.value:'普通',el.dataset.d);}
  else if(act==='idea-add'){const v=el.value.trim();if(v){state.ideas.unshift({id:uid(),type:ui.ideaQuick,text:v,date:todayKey()});saveState();render();}}
  else if(act==='ch-add'){const p=state.papers.find(p=>p.id===el.dataset.p);if(p&&el.value.trim()){p.chapters.push({name:el.value.trim(),done:false});saveState();render();}}
  else if(act==='acc-topic'){const k=el.dataset.k;if(el.value.trim()){const sel=document.getElementById('acc-topic-status-'+k);state.accounts[k].topics.push({id:uid(),text:el.value.trim(),status:sel?sel.value:'未成文',date:todayKey()});saveState();render();}}
});
document.body.addEventListener('change',e=>{
  const el=e.target.closest('[data-change]');if(!el)return;
  switch(el.dataset.change){
    case 'acc-target':{state.accounts[el.dataset.k].target=Math.max(1,+el.value||52);saveState();render();break;}
    case 'novel-words':state.novel.words=Math.max(0,+el.value||0);saveState();render();break;
    case 'novel-stage':state.novel.stage=el.value;saveState();render();break;
    case 'eng-exam':state.english.examType=el.value;saveState();render();break;
  }
});

/* ====== 手机端"更多"页面 ====== */
function vMoreMobile(){
  const items=[['academic','📖','学术进度','论文进度'],['accp','🔥','个人公众号','发文统计'],['accw','💼','工作公众号','发文统计'],['concept','🎯','观念工夫','观念记录'],['novel','✒️','小说字数','创作笔记'],['reading','📝','读书札记','阅读笔记'],['english','📕','英语学习','单词/听力/阅读/口语'],['exercise','💪','运动锻炼','运动/体重记录'],['finance','💰','财经资讯','外部渠道'],['ainews','🤖','AI资讯','外部渠道'],['hottrends','🔥','每日热点','热榜+热梗+AI解读'],['settings','⚙️','设置','同步/备份']];
  const g='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">'+items.map(([v,i,n,s])=>'<div class="card" style="cursor:pointer;margin:0;padding:15px 14px" data-act="nav" data-view="'+v+'"><div style="font-size:22px">'+i+'</div><div style="font-family:Noto Serif SC,serif;font-size:14.5px;font-weight:700;letter-spacing:1px;margin-top:5px">'+n+'</div><div style="font-size:11px;color:var(--ink-faint);margin-top:1px">'+s+'</div></div>').join('')+'</div>';
  return pageHead('🧭 更多模块','学术 · 公众号 · 观念 · 小说 · 札记 · 英语 · 运动 · 资讯 · 设置')+g;
}

/* 覆盖手机端更多 */
const _origRender=render;
render=function(){renderNav();renderTabs();let viewFn=RENDER[ui.view];if(!viewFn&&ui.view==='more'){/* 手机更多页 */$('#main').innerHTML=vMoreMobile();$('#todayStr').textContent=todayCN();const tsM=$('#todayStrM');if(tsM)tsM.textContent=todayCN();window.scrollTo(0,0);return;}_origRender();};

/* ====== 初始化 ====== */
async function init(){
  await loadState();
  setConn('offline');
  render();
  checkCheer();
  initSupabase();
  // 在线/离线检测
  window.addEventListener('online',()=>{if(sbConfig().url)initSupabase();else setConn('offline');});
  window.addEventListener('offline',()=>setConn('offline'));
}
// 实时时钟（总览 Hero）
function tickClock(){
  const el=document.getElementById('hClock');if(!el)return;
  const d=new Date();
  el.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}
setInterval(tickClock,1000);
init();
tickClock();
</script>
